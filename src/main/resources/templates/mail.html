<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body style="margin:0; padding:0; background-color:#f0f4ff; font-family:'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f4ff; padding: 48px 16px;">
    <tr>
      <td align="center">
        <table width="520" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow: 0 4px 24px rgba(30,90,220,0.10);">

          <!-- 헤더 -->
          <tr>
            <td align="center" style="background-color:#1a6dff; padding: 40px 48px 36px;">
              <p style="margin:0; font-size:28px; font-weight:700; color:#ffffff; letter-spacing:-0.5px;">Hatoo</p>
              <p style="margin:10px 0 0; font-size:14px; color:rgba(255,255,255,0.80); letter-spacing:0.3px;">이메일 인증 코드 안내</p>
            </td>
          </tr>

          <!-- 본문 -->
          <tr>
            <td style="padding: 44px 48px 16px;">
              <p style="margin:0; font-size:21px; font-weight:700; color:#0d1b3e; line-height:1.5;">
                안녕하세요!<br/>이메일 인증 코드를 보내드립니다.
              </p>
              <p style="margin:16px 0 0; font-size:15px; color:#6b7280; line-height:1.7;">
                아래 6자리 코드를 앱에 입력해 주세요.<br/>
                코드는 <strong style="color:#0d1b3e;">7분간</strong> 유효합니다.
              </p>
            </td>
          </tr>

          <!-- 인증 코드 박스 -->
          <tr>
            <td style="padding: 28px 48px;">
              <div style="background-color:#f0f4ff; border-radius:12px; padding: 32px; text-align:center; border: 1.5px solid #c2d4ff;">
                <p style="margin:0 0 10px; font-size:12px; font-weight:600; color:#5b8dee; letter-spacing:2px;">VERIFICATION CODE</p>
                <p th:text="${code}" style="margin:0; font-size:44px; font-weight:800; color:#1a6dff; letter-spacing:12px; font-family:'Courier New', monospace;"></p>
              </div>
            </td>
          </tr>

          <!-- 주의사항 -->
          <tr>
            <td style="padding: 0 48px 40px;">
              <div style="background-color:#f8faff; border-left: 3px solid #1a6dff; border-radius:0 8px 8px 0; padding: 16px 20px;">
                <p style="margin:0; font-size:13px; color:#9ca3af; line-height:1.7;">
                  본인이 요청하지 않은 경우 이 메일을 무시하셔도 됩니다.<br/>
                  코드를 타인과 공유하지 마세요.
                </p>
              </div>
            </td>
          </tr>

          <!-- 푸터 -->
          <tr>
            <td align="center" style="background-color:#f8faff; border-top: 1px solid #e8eeff; padding: 24px 48px;">
              <p style="margin:0; font-size:12px; color:#c4c4c4;">© 2026 Hatoo. All rights reserved.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
