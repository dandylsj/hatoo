name: Spring Boot → NAS Docker 배포

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  # 1. 빌드 & Push (GitHub 클라우드에서 진행)
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 + Gradle 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 빌드 (JAR 생성)
        run: ./gradlew clean bootJar -x test

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dandylsj/hatoo:latest

  # 2. NAS에 배포 (self-hosted runner에서만 실행)
  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: NAS에 자동 배포 (컨테이너 재시작)
        run: |
          docker stop hatoo-app 2>/dev/null || true
          docker rm hatoo-app 2>/dev/null || true
          docker pull ghcr.io/dandylsj/hatoo:latest
          docker run -d \
            --name hatoo-app \
            --restart always \
            -p 8080:8080 \
            ghcr.io/dandylsj/hatoo:latest