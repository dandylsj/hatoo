spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hatoo?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  firebase:
    credentials: ${FIREBASE_CREDENTIALS}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

  api-docs:
    enabled: true
    version: openapi_3_0

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}

JWT_SECRET_KEY: ${JWT_SECRET_KEY}

gemini:
  api-key: ${GEMINI_API_KEY}

minio:
  endpoint: ${MINIO_ENDPOINT}
  public-url: ${MINIO_PUBLIC_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

coupang:
  access-key: ${COUPANG_ACCESS_KEY}
  secret-key: ${COUPANG_SECRET_KEY}