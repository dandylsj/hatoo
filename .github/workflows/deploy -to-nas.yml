name: Spring Boot → NAS Docker 배포

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 + Gradle 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 빌드
        run: ./gradlew clean build -x test

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dandylsj/hatoo:latest

  deploy:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      - name: GHCR 로그인 (PAT 사용)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 1. 깃액션 작업 공간(Workspace)에 .env 파일을 동적으로 생성합니다.
      - name: 환경 변수 파일(.env) 생성
        run: |
          rm -f .env
          touch .env
          echo "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> .env
          echo "SPRING_JPA_HIBERNATE_DDL_AUTO=update" >> .env
          echo "TZ=Asia/Seoul" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env

      # 2. 생성된 .env 파일을 참조하여 컨테이너를 실행합니다.
      - name: NAS에 자동 배포
        run: |
          echo "🧹 기존 컨테이너 정리 중..."
          docker stop hatoo-app 2>/dev/null || true
          docker rm -f hatoo-app 2>/dev/null || true
          
          echo "📥 최신 도커 이미지 다운로드 중..."
          docker pull ghcr.io/dandylsj/hatoo:latest
          
          echo "🚀 새 컨테이너 실행 중..."
          # 절대 경로 대신, 현재 작업 공간에 생성된 .env 파일을 사용합니다.
          docker run -d \
            --name hatoo-app \
            --restart always \
            --network hatoo \
            -p 8080:8080 \
            --env-file .env \
            ghcr.io/dandylsj/hatoo:latest