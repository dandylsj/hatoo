name: Spring Boot → NAS Docker 배포

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 + Gradle 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 빌드
        run: ./gradlew clean build -x test

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dandylsj/hatoo:latest

  deploy:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      - name: GHCR 로그인 (PAT 사용)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}     # ← 여기서 PAT 사용!

      - name: NAS에 자동 배포
        run: |
          echo "🧹 기존 컨테이너 정리 중..."
          docker stop hatoo-app 2>/dev/null || true
          docker rm -f hatoo-app 2>/dev/null || true
          sleep 2

          echo "🚀 새 컨테이너 실행 중..."
          docker run -d \
            --name hatoo-app \
            --restart always \
            -p 8080:8080 \
            ghcr.io/dandylsj/hatoo:latest