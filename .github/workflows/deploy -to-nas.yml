name: Spring Boot -> NAS Docker 배포

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 + Gradle 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 빌드
        run: ./gradlew clean build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dandylsj/hatoo:latest

  deploy:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read

    steps:
      - name: GHCR 로그인 (PAT 사용)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: 환경 변수 파일(.env) 생성
        run: |
          rm -f .env
          touch .env
          echo "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> .env
          echo "SPRING_JPA_HIBERNATE_DDL_AUTO=update" >> .env
          echo "SPRING_MAIL_HOST=smtp.gmail.com" >> .env
          echo "SPRING_MAIL_PORT=587" >> .env
          echo "SPRING_MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "SPRING_MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          echo "SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true" >> .env
          echo "SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true" >> .env
          echo "TZ=Asia/Seoul" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "FIREBASE_CREDENTIALS=${{ secrets.FIREBASE_CREDENTIALS }}" >> .env
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
          echo "KAKAO_ADMIN_KEY=${{ secrets.KAKAO_ADMIN_KEY }}" >> .env
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> .env
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> .env
          echo "SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER=method" >> .env
          echo "SPRINGDOC_SWAGGER_UI_TAGS_SORTER=alpha" >> .env
          echo "SPRING_JPA_SHOW_SQL=false" >> .env
          echo "SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=false" >> .env
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env

      - name: Redis 컨테이너 hatoo 네트워크 연결 확인
        run: |
          # redis 컨테이너가 hatoo 네트워크에 없으면 연결
          if ! docker inspect redis --format '{{json .NetworkSettings.Networks}}' | grep -q '"hatoo"'; then
            echo "redis 컨테이너를 hatoo 네트워크에 연결합니다..."
            docker network connect hatoo redis
          else
            echo "redis 이미 hatoo 네트워크에 연결되어 있습니다."
          fi

      - name: NAS에 자동 배포
        run: |
          docker stop hatoo-app 2>/dev/null || true
          docker rm -f hatoo-app 2>/dev/null || true
          docker pull ghcr.io/dandylsj/hatoo:latest
          docker run -d --name hatoo-app --restart always --network hatoo -p 8080:8080 --env-file .env ghcr.io/dandylsj/hatoo:latest