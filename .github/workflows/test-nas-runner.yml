name: NAS Runner 테스트

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  test-on-nas:
    runs-on: self-hosted

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설치 (필수!)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: NAS Runner에서 실행 중인지 확인
        run: |
          echo "✅ Synology NAS Self-hosted Runner에서 실행되었습니다!"
          echo "현재 시간: $(date)"
          echo "Java 버전:"
          java -version
          echo "작업 디렉토리: $PWD"