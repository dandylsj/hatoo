name: Spring Boot -> Ubuntu Server 무중단 배포 (Blue-Green)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 + Gradle 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 빌드
        run: ./gradlew clean build -x test

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dandylsj/hatoo:ubuntu
          provenance: false

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, ubuntu-server]
    environment: ubuntu

    steps:
      - name: GHCR 로그인 (PAT 사용)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: 환경 변수 파일(.env) 생성
        run: |
          rm -f .env
          touch .env
          echo "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> .env
          echo "SPRING_JPA_HIBERNATE_DDL_AUTO=update" >> .env
          echo "SPRING_MAIL_HOST=smtp.gmail.com" >> .env
          echo "SPRING_MAIL_PORT=587" >> .env
          echo "SPRING_MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "SPRING_MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
          echo "SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true" >> .env
          echo "SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true" >> .env
          echo "TZ=Asia/Seoul" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          echo "FIREBASE_CREDENTIALS=${{ secrets.FIREBASE_CREDENTIALS }}" >> .env
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
          echo "KAKAO_ADMIN_KEY=${{ secrets.KAKAO_ADMIN_KEY }}" >> .env
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> .env
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> .env
          echo "SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER=method" >> .env
          echo "SPRINGDOC_SWAGGER_UI_TAGS_SORTER=alpha" >> .env
          echo "SPRING_JPA_SHOW_SQL=false" >> .env
          echo "SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=false" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "SERVER_SHUTDOWN=graceful" >> .env
          echo "SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s" >> .env
          echo "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health" >> .env

      - name: Docker 네트워크 및 인프라 컨테이너 연결 확인
        run: |
          docker network inspect hatoo >/dev/null 2>&1 || docker network create hatoo

          if ! docker inspect redis --format '{{json .NetworkSettings.Networks}}' 2>/dev/null | grep -q '"hatoo"'; then
            docker network connect hatoo redis 2>/dev/null || true
          fi

          if ! docker inspect mysql-server --format '{{json .NetworkSettings.Networks}}' 2>/dev/null | grep -q '"hatoo"'; then
            docker network connect hatoo mysql-server 2>/dev/null || true
          fi

      - name: Nginx 설정 파일 준비
        run: |
          mkdir -p $HOME/nginx/conf.d

          cat > $HOME/nginx/nginx.conf << 'EOF'
          events { worker_connections 1024; }
          http {
              include /etc/nginx/conf.d/*.conf;
              server {
                  listen 80;
                  location / {
                      proxy_pass http://hatoo_app;
                      proxy_http_version 1.1;
                      proxy_set_header Connection "";
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      proxy_read_timeout 60s;
                      proxy_connect_timeout 10s;
                  }
              }
          }
          EOF

      - name: 블루/그린 무중단 배포
        run: |
          IMAGE="ghcr.io/dandylsj/hatoo:ubuntu"

          # ── 1. 현재 활성 색상 확인 ──
          if docker ps --filter "name=hatoo-blue" --format "{{.Names}}" | grep -q "hatoo-blue"; then
            ACTIVE_COLOR="blue"
            NEW_COLOR="green"
          elif docker ps --filter "name=hatoo-green" --format "{{.Names}}" | grep -q "hatoo-green"; then
            ACTIVE_COLOR="green"
            NEW_COLOR="blue"
          else
            ACTIVE_COLOR=""
            NEW_COLOR="blue"
          fi

          echo "현재 활성: ${ACTIVE_COLOR:-없음(최초 배포)}, 신규 배포: $NEW_COLOR"

          # 레거시 hatoo-app 컨테이너 처리 (최초 전환 시)
          if docker ps -a --filter "name=^/hatoo-app$" --format "{{.Names}}" | grep -q "hatoo-app"; then
            docker stop hatoo-app 2>/dev/null || true
            docker rm hatoo-app 2>/dev/null || true
            echo "레거시 hatoo-app 컨테이너 제거 완료"
          fi

          # 이전 배포에서 남은 NEW_COLOR 컨테이너 제거
          docker rm -f hatoo-$NEW_COLOR 2>/dev/null || true

          # ── 2. 새 이미지 pull ──
          docker pull $IMAGE

          # ── 3. 새 컨테이너 시작 (포트 노출 없이 내부 네트워크만) ──
          docker run -d \
            --name hatoo-$NEW_COLOR \
            --network hatoo \
            --restart always \
            --env-file .env \
            $IMAGE

          echo "hatoo-$NEW_COLOR 컨테이너 시작됨"

          # ── 4. 헬스체크 (최대 90초 대기) ──
          CONTAINER_IP=$(docker inspect --format='{{.NetworkSettings.Networks.hatoo.IPAddress}}' hatoo-$NEW_COLOR)
          HEALTH_URL="http://$CONTAINER_IP:8080/actuator/health"
          echo "헬스체크 URL: $HEALTH_URL"

          HEALTH_OK=false
          for i in $(seq 1 18); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ 헬스체크 통과 (${i}번째 시도, ${i}*5초 경과)"
              HEALTH_OK=true
              break
            fi
            echo "대기 중... (${i}/18, 상태: $HTTP_STATUS)"
            sleep 5
          done

          if [ "$HEALTH_OK" = "false" ]; then
            echo "❌ 헬스체크 실패 - 신규 컨테이너 롤백"
            docker rm -f hatoo-$NEW_COLOR
            exit 1
          fi

          # ── 5. Nginx upstream 업데이트 ──
          cat > $HOME/nginx/conf.d/upstream.conf << EOF
          upstream hatoo_app {
              server hatoo-$NEW_COLOR:8080;
          }
          EOF

          # Nginx 시작 또는 무중단 리로드
          if docker ps --filter "name=^/nginx$" --format "{{.Names}}" | grep -q "nginx"; then
            docker exec nginx nginx -s reload
            echo "✅ Nginx 리로드 완료 → hatoo-$NEW_COLOR 로 트래픽 전환"
          else
            docker rm -f nginx 2>/dev/null || true
            docker run -d \
              --name nginx \
              --network hatoo \
              -p 8080:80 \
              --restart always \
              -v $HOME/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v $HOME/nginx/conf.d:/etc/nginx/conf.d:ro \
              nginx:alpine
            echo "✅ Nginx 최초 시작 완료"
          fi

          # ── 6. 구 컨테이너 Graceful Shutdown ──
          if [ -n "$ACTIVE_COLOR" ]; then
            echo "구 컨테이너(hatoo-$ACTIVE_COLOR) Graceful Shutdown 중..."
            docker stop --time 30 hatoo-$ACTIVE_COLOR
            docker rm hatoo-$ACTIVE_COLOR
            echo "✅ 구 컨테이너 제거 완료"
          fi

          docker image prune -f
          echo "🚀 무중단 배포 완료! (활성: hatoo-$NEW_COLOR)"
